<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- This is a demo / embed surface; keep it out of search. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Fact or Fiction | Lenz</title>
    <!-- Social/OG tags live on the wrapper page (lenz.io/play), which is the
         canonical shareable surface. This standalone app is embedded there. -->
    <meta name="theme-color" content="#FFFDF7" />
    <!-- Theme: read lenz_theme cookie from parent site, fall back to OS preference -->
    <script>
    (function(){
      var d=document.documentElement,m='(prefers-color-scheme:dark)';
      var c=document.cookie.split(';').find(function(s){return s.trim().startsWith('lenz_theme=')});
      var p=c?c.split('=')[1].trim():'system';
      var r=p==='system'?(window.matchMedia&&window.matchMedia(m).matches?'dark':'light'):p;
      d.dataset.theme=r;
      var tc=document.querySelector('meta[name="theme-color"]');
      if(tc)tc.content=r==='dark'?'#1A1816':'#FFFDF7';
      try{window.matchMedia(m).addEventListener('change',function(){
        if(p==='system'){
          r=window.matchMedia(m).matches?'dark':'light';
          d.dataset.theme=r;
          if(tc)tc.content=r==='dark'?'#1A1816':'#FFFDF7';
        }
      })}catch(e){}
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
